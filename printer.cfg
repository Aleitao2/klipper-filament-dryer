# ====================================================================
# 1. MCU & KINEMATICS SETUP
# ====================================================================
[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_<your-mcu-id>-if00

[printer]
kinematics: none
max_velocity: 300
max_accel: 3000

[idle_timeout]
# 24 hours (86400 seconds) to prevent Klipper from shutting down during long dry cycles
timeout: 86400
gcode:
    # Failsafe shutdown if the 24 hours are ever reached
    M140 S0
    SET_FAN_SPEED FAN=circulation_fan SPEED=0.0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.0
    M117 Timeout Shutdown

[board_pins]
aliases:
    EXP1_1=PB5,  EXP1_3=PA9,   EXP1_5=PA10, EXP1_7=PB8, EXP1_9=<GND>,
    EXP1_2=PA15, EXP1_4=<RST>, EXP1_6=PB9,  EXP1_8=PD6, EXP1_10=<5V>

# ====================================================================
# 2. SOVOL SCREEN CONFIGURATION
# ====================================================================
[display]
lcd_type: emulated_st7920
spi_software_miso_pin: PD8 
spi_software_mosi_pin: PD6
spi_software_sclk_pin: PB9
en_pin: PB8
encoder_pins: ^PA10, ^PA9
click_pin: ^!PA15

[output_pin beeper]
pin: PB5

# ====================================================================
# 3. DRYBOX HEATER & FANS
# ====================================================================
[heater_bed]
heater_pin: PC9
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_Kp: 54.027
pid_Ki: 0.770
pid_Kd: 948.182
min_temp: 0
max_temp: 95 

[fan_generic exhaust_fan]
pin: PC6 

[fan_generic circulation_fan]
pin: PB15 

# ====================================================================
# 4. DRYING AUTOMATION & TIMERS
# ====================================================================
[gcode_macro DRYING_STATE]
variable_manual_temp: 50
variable_manual_time: 4
variable_time_remaining_mins: 0
variable_is_drying: 0
gcode:
    # Storage block only

[gcode_macro START_DRYING]
gcode:
    {% set temp = params.TEMP|default(0)|int %}
    {% set time_hrs = params.TIME_HOURS|default(0)|int %}
    {% set total_mins = time_hrs * 60 %}
    
    # Save the total minutes and mark system as active
    SET_GCODE_VARIABLE MACRO=DRYING_STATE VARIABLE=time_remaining_mins VALUE={total_mins}
    SET_GCODE_VARIABLE MACRO=DRYING_STATE VARIABLE=is_drying VALUE=1
    
    # Hardware Triggers
    M140 S{temp}
    SET_FAN_SPEED FAN=circulation_fan SPEED=1.0
    UPDATE_DELAYED_GCODE ID=VENT_CYCLE_START DURATION=1
    
    # Start our custom status bar timer
    UPDATE_DELAYED_GCODE ID=DRYBOX_TICK DURATION=1

[gcode_macro STOP_DRYING]
gcode:
    # Reset variables
    SET_GCODE_VARIABLE MACRO=DRYING_STATE VARIABLE=time_remaining_mins VALUE=0
    SET_GCODE_VARIABLE MACRO=DRYING_STATE VARIABLE=is_drying VALUE=0
    
    # Hardware Off
    M140 S0
    SET_FAN_SPEED FAN=circulation_fan SPEED=0.0
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.0
    
    # Kill background loops
    UPDATE_DELAYED_GCODE ID=VENT_CYCLE_START DURATION=0
    UPDATE_DELAYED_GCODE ID=VENT_CYCLE_STOP DURATION=0
    UPDATE_DELAYED_GCODE ID=DRYBOX_TICK DURATION=0
    
    # Clear screen
    M117 Drybox Ready

# --- Exhaust Fan Loop ---
[delayed_gcode VENT_CYCLE_START]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=1.0
    UPDATE_DELAYED_GCODE ID=VENT_CYCLE_STOP DURATION=30

[delayed_gcode VENT_CYCLE_STOP]
gcode:
    SET_FAN_SPEED FAN=exhaust_fan SPEED=0.0
    UPDATE_DELAYED_GCODE ID=VENT_CYCLE_START DURATION=120

# --- Visual Timer Loop ---
[delayed_gcode DRYBOX_TICK]
gcode:
    {% set mins = printer["gcode_macro DRYING_STATE"].time_remaining_mins|int %}
    {% set active = printer["gcode_macro DRYING_STATE"].is_drying|int %}
    
    {% if active == 1 %}
        {% if mins > 0 %}
            # Calculate hours and minutes for display
            {% set display_hrs = (mins / 60)|int %}
            {% set display_mins = (mins % 60)|int %}
            
            # Print to the bottom of the LCD screen
            M117 Time Left: {display_hrs}h {display_mins}m
            
            # Decrement by 1 minute and save
            {% set next_mins = mins - 1 %}
            SET_GCODE_VARIABLE MACRO=DRYING_STATE VARIABLE=time_remaining_mins VALUE={next_mins}
            
            # Loop again in 60 seconds
            UPDATE_DELAYED_GCODE ID=DRYBOX_TICK DURATION=60
        {% else %}
            # Timer reached zero
            M117 Drying Complete!
            STOP_DRYING
        {% endif %}
    {% endif %}

# ====================================================================
# 5. CUSTOM LCD MENU INTERFACE
# ====================================================================

# --- 1. Disable Unwanted Default Clutter ---
[menu __main __temperature]
type: disabled

[menu __main __octoprint]
type: disabled

[menu __main __control]
type: disabled

[menu __main __filament]
type: disabled

# Notice: __setup is NO LONGER disabled, so it will come back!

# --- 2. The Main Root Menu Layout ---
# (Klipper forces the ".." button to be at the top here)

[menu __main __drybox]
type: list
name: Drybox
index: 1 # Forces Drybox to be the first item under ".."

[menu __main __stop_dry]
type: command
name: STOP DRYING
index: 2 # Forces STOP DRYING to be the second item
gcode: 
    STOP_DRYING
    {menu.exit()}

[menu __main __setup]
type: list
enable: {True}
name: Setup
index: 3 # Forces the default Setup menu to be the third item


# --- 3. Inside the Drybox Folder ---
[menu __main __drybox __profiles]
type: list
name: Profiles
index: 1

[menu __main __drybox __profiles __pla]
type: command
name: PLA (60C 6h)
gcode: 
    START_DRYING TEMP=60 TIME_HOURS=6
    {menu.exit()}

[menu __main __drybox __profiles __petg]
type: command
name: PETG (70C 9h)
gcode: 
    START_DRYING TEMP=70 TIME_HOURS=9
    {menu.exit()}

[menu __main __drybox __profiles __abs]
type: command
name: ABS (80C 8h)
gcode: 
    START_DRYING TEMP=80 TIME_HOURS=8
    {menu.exit()}


# --- 4. Inside the Manual Setup Folder ---
[menu __main __drybox __manual]
type: list
name: Manual Setup
index: 2

[menu __main __drybox __manual __set_temp]
type: input
name: Temp: {'%3d' % menu.input} C
index: 1
input: {printer["gcode_macro DRYING_STATE"].manual_temp}
input_min: 20
input_max: 90
input_step: 1
gcode:
    SET_GCODE_VARIABLE MACRO=DRYING_STATE VARIABLE=manual_temp VALUE={menu.input}

[menu __main __drybox __manual __set_time]
type: input
name: Time: {'%2d' % menu.input} hr
index: 2
input: {printer["gcode_macro DRYING_STATE"].manual_time}
input_min: 1
input_max: 24
input_step: 1
gcode:
    SET_GCODE_VARIABLE MACRO=DRYING_STATE VARIABLE=manual_time VALUE={menu.input}

[menu __main __drybox __manual __start]
type: command
name: Confirm & Start
index: 3 # Guarantees this button stays at the bottom under Temp and Time!
gcode:
    START_DRYING TEMP={printer["gcode_macro DRYING_STATE"].manual_temp} TIME_HOURS={printer["gcode_macro DRYING_STATE"].manual_time}
    {menu.exit()}